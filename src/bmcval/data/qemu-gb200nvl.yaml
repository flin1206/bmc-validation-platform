name: qemu-gb200nvl
description: OpenBMC gb200nvl-obmc (NVIDIA GB200 NVL, AST2600) under QEMU's gb200nvl-bmc machine (QEMU >= 10).

qemu:
  binary: qemu-system-arm
  machine: gb200nvl-bmc
  memory_mb: 1024
  image_glob: "obmc-phosphor-image-gb200nvl-obmc*.static.mtd"
  hostfwd:
    ssh: 2222
    https: 2443
    ipmi_udp: 2623

endpoints:
  host: 127.0.0.1
  https_port: 2443
  ipmi_port: 2623
  ssh_port: 2222

credentials:
  username: root
  password: 0penBmc

# Start conservative; capabilities are added as they are observed working in QEMU.
capabilities:
  - redfish
  - redfish_sessions
  - account_service
  - firmware_inventory

timeouts:
  boot: 1200
  redfish_ready: 900
  power_transition: 120
  firmware_task: 900

sensors:
  min_count: 0
